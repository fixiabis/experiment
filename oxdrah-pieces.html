<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OXDRAH PIECES</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Sono:wght@200..800&display=swap" rel="stylesheet" />
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding-inline: 0.2cm;
      }

      @media print {
        body {
          padding: 0;
        }
      }

      .pieces {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        align-items: flex-start;
        row-gap: calc((var(--pieces_height) / 4 - 4.8cm) * 4 / 5);
        column-gap: calc((var(--pieces_width) / 6 - 4.8cm) * 6 / 7);
        padding-block: calc((var(--pieces_height) / 4 - 4.8cm) * 4 / 5);
        padding-inline: calc((var(--pieces_width) / 6 - 4.8cm) * 6 / 7);
        font-family: "Sono", sans-serif;
      }

      .pieces > .piece {
        width: 4.8cm;
        height: 4.8cm;
      }

      .piece {
        position: relative;
        border-radius: 0.4cm;
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: white;
        color: black;
      }

      .piece.-black {
        background-color: black;
        color: white;
      }

      .piece > .piece-link {
        position: absolute;
        --piece-link_width: 0.35cm;
        --piece-link_height: 0.7cm;
        --piece-link_color: rgba(0, 0, 0, 0.75);
      }

      .piece.-black > .piece-link {
        --piece-link_color: rgba(255, 255, 255, 0.75);
      }

      .piece > .piece-frontface,
      .piece > .piece-backface {
        position: absolute;
        width: 100%;
        height: 100%;
        transform-style: preserve-3d;
        backface-visibility: hidden;
      }

      .piece > .piece-backface {
        transform: rotateY(180deg);
      }

      .piece > .piece-link.--top,
      .piece > .piece-link.--bottom {
        left: calc(50% - var(--piece-link_width) / 2);
        width: var(--piece-link_width);
        height: var(--piece-link_height);
      }

      .piece > .piece-link.--top {
        top: 0;
      }

      .piece > .piece-link.--bottom {
        bottom: 0;
      }

      .piece > .piece-link.--left,
      .piece > .piece-link.--right {
        top: calc(50% - var(--piece-link_width) / 2);
        width: var(--piece-link_height);
        height: var(--piece-link_width);
      }

      .piece > .piece-link.--left {
        left: 0;
      }

      .piece > .piece-link.--right {
        right: 0;
      }

      .piece > .piece-point {
        position: absolute;
        bottom: 0.4cm;
        left: 0.4cm;
        width: 1cm;
        height: 1cm;
        transform: rotate(180deg);
        backface-visibility: hidden;
        filter: brightness(0.9);
      }

      .piece.-black > .piece-point {
        filter: brightness(1.1);
      }

      .piece > .piece-serial {
        position: absolute;
        top: 0.4cm;
        right: 0.4cm;
        width: 1cm;
        height: 1cm;
      }

      .piece > .piece-symbol {
        width: 2cm;
        height: 2cm;
      }

      .piece-link {
        background-color: var(--piece-link_color, rgba(127, 127, 127, 1));
      }

      .piece-symbol {
        position: relative;
      }

      .piece-symbol > svg {
        width: 100%;
        height: 100%;
      }

      .piece-point {
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .piece-point > svg {
        width: 100%;
        height: 100%;
      }

      .piece-point.-crimson > svg {
        stroke: crimson;
      }

      .piece-point.-royalblue > svg {
        stroke: royalblue;
      }

      .piece-point.-darkorange > svg {
        stroke: darkorange;
      }

      .piece-point.-seagreen > svg {
        stroke: seagreen;
      }

      .piece-point.-blueviolet > svg {
        stroke: blueviolet;
      }

      .piece-point.-sienna > svg {
        stroke: sienna;
      }

      .piece-serial {
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 0.7cm;
        font-weight: 500;
      }

      .piece-backface {
        background-image: linear-gradient(150deg, #000 50%, #fff 50%);
      }

      .piece-backface > .piece-backface-text {
        mix-blend-mode: difference;
      }

      .piece-backface-text {
        color: white;
        font-family: "Sono", sans-serif;
        font-size: 1cm;
        font-weight: 500;
        text-align: center;
        line-height: 1.2;
        padding: 0.2cm;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .piece-wrapper {
        position: relative;
        background-color: inherit;
      }

      .piece-wrapper > .piece {
        width: 100%;
        height: 100%;
        position: absolute;
        top: 0;
        left: 0;
        perspective: 1000px;
        transform-style: preserve-3d;
        transition: transform 0.6s;
        box-shadow: 0 0 0.2cm 0 rgba(0, 0, 0, 0.25);
      }

      .piece-wrapper:active > .piece {
        transform: rotateY(180deg);
      }

      .pieces-header {
        font-family: "Sono", sans-serif;
        font-size: 76px;
        font-weight: 500;
        text-align: center;
        padding-block: 15px;
      }

      .pieces-header:hover ~ .pieces > .piece-wrapper > .piece {
        transform: rotateY(180deg);
      }
    </style>
    <style>
      .sort-controls {
        font-family: "Sono", sans-serif;
        padding: 16px;
        max-width: calc(4.8cm * 6 + 0.4cm * 7);
        margin: 0 auto;
        background-color: #f5f5f5;
        border-radius: 16px;
        margin-bottom: 16px;
      }

      .sort-controls-title {
        font-size: 24px;
        font-weight: 500;
        display: flex;
        align-items: center;
        gap: 8px;
        justify-content: space-between;
      }

      .sort-controls-list:not(:empty) {
        margin-top: 16px;
      }

      .sort-controls-row {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 8px;
        padding: 8px;
        background-color: white;
        border-radius: 8px;
      }

      .sort-controls-row:not(:first-child) {
        margin-top: 8px;
      }

      .sort-controls-label {
        font-size: 18px;
        font-weight: 500;
        min-width: 45px;
      }

      .sort-controls-select {
        flex: 1;
        font-family: "Sono", sans-serif;
        font-size: 18px;
        padding: 8px;
        border: 1px solid #ccc;
        border-radius: 8px;
        background-color: white;
      }

      .sort-controls-order {
        font-family: "Sono", sans-serif;
        font-size: 18px;
        padding: 8px;
        border: 1px solid #ccc;
        border-radius: 8px;
        background-color: white;
        min-width: 76px;
      }

      .sort-controls-button {
        font-family: "Sono", sans-serif;
        font-size: 18px;
        padding: 8px 24px;
        border: none;
        border-radius: 8px;
        background-color: #333;
        color: white;
        cursor: pointer;
        width: 100%;
      }

      .sort-controls-button:hover {
        background-color: #555;
      }

      .sort-controls-remove {
        font-family: "Sono", sans-serif;
        font-size: 18px;
        padding: 11px 19px;
        border: none;
        border-radius: 8px;
        background-color: #cc3333;
        color: white;
        cursor: pointer;
        min-width: 45px;
        white-space: nowrap;
      }

      .sort-controls-remove:hover {
        background-color: #aa2222;
      }

      .sort-controls-up {
        font-family: "Sono", sans-serif;
        font-size: 18px;
        padding: 8px 16px;
        border: none;
        border-radius: 8px;
        background-color: #3333cc;
        color: white;
        cursor: pointer;
        min-width: 57px;
        white-space: nowrap;
      }

      .sort-controls-up:hover {
        background-color: #2222aa;
      }

      .sort-controls-up:disabled {
        background-color: #cccccc;
        color: #666666;
        cursor: not-allowed;
      }

      .sort-controls-add {
        font-family: "Sono", sans-serif;
        font-size: 18px;
        padding: 8px 24px;
        border: none;
        border-radius: 8px;
        background-color: #33aa33;
        color: white;
        cursor: pointer;
      }

      .sort-controls-add:hover {
        background-color: #228822;
      }

      .filter-controls {
        font-family: "Sono", sans-serif;
        padding: 16px;
        max-width: calc(4.8cm * 6 + 0.4cm * 7);
        margin: 0 auto;
        background-color: #f0f0f0;
        border-radius: 16px;
        margin-bottom: 16px;
      }

      .filter-controls-title {
        font-size: 24px;
        font-weight: 500;
        display: flex;
        align-items: center;
        gap: 8px;
        justify-content: space-between;
      }

      .filter-controls-list:not(:empty) {
        margin-top: 16px;
      }

      .filter-controls-item {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 8px;
        padding: 8px;
        background-color: white;
        border-radius: 8px;
      }

      .filter-controls-item:not(:first-child) {
        margin-top: 8px;
      }

      .filter-controls-field {
        flex: 1.5;
        font-family: "Sono", sans-serif;
        font-size: 18px;
        padding: 8px;
        border: 1px solid #ccc;
        border-radius: 8px;
        background-color: white;
      }

      .filter-controls-operator {
        flex: 1;
        font-family: "Sono", sans-serif;
        font-size: 18px;
        padding: 8px;
        border: 1px solid #ccc;
        border-radius: 8px;
        background-color: white;
      }

      .filter-controls-value {
        flex: 1.5;
        font-family: "Sono", sans-serif;
        font-size: 18px;
        padding: 8px;
        border: 1px solid #ccc;
        border-radius: 8px;
        background-color: white;
      }

      .filter-controls-remove {
        font-family: "Sono", sans-serif;
        font-size: 18px;
        padding: 8px 16px;
        border: none;
        border-radius: 8px;
        background-color: #cc3333;
        color: white;
        cursor: pointer;
        min-width: 45px;
        white-space: nowrap;
      }

      .filter-controls-remove:hover {
        background-color: #aa2222;
      }

      .filter-controls-add {
        font-family: "Sono", sans-serif;
        font-size: 18px;
        padding: 8px 24px;
        border: none;
        border-radius: 8px;
        background-color: #33aa33;
        color: white;
        cursor: pointer;
      }

      .filter-controls-add:hover {
        background-color: #228822;
      }

      @media print {
        .sort-controls,
        .filter-controls {
          display: none;
        }
      }
    </style>
    <style>
      * > .pieces {
        max-width: calc(4.8cm * 6 + 0.4cm * 7);
        margin-inline: auto;
        --pieces_width: calc(4.8cm * 6 + 0.4cm * 7);
        --pieces_height: calc(4.8cm * 4 + 0.4cm * 5);
      }

      * > .pieces-header ~ .pieces {
        margin-block-start: -0.4cm;
      }

      @media print {
        * > .pieces {
          width: 29.7cm;
          height: 21cm;
          --pieces_width: 29.7cm;
          --pieces_height: 21cm;
        }

        * > .pieces-header ~ .pieces {
          margin-block-start: 0;
        }

        * > .pieces-header + .pieces ~ .pieces {
          break-before: page;
        }

        * > .pieces-header {
          display: none;
        }

        .pieces-header:hover ~ .pieces > .piece-wrapper > .piece > .piece-frontface,
        .piece-wrapper:active > .piece > .piece-frontface {
          visibility: hidden;
        }
      }
    </style>
  </head>
  <body>
    <div class="pieces-header">OXDRAH PIECES</div>
    <div class="sort-controls">
      <div class="sort-controls-title">
        排序設定
        <button class="sort-controls-add" id="addSort">新增排序條件</button>
      </div>
      <div class="sort-controls-list" id="sortList"></div>
    </div>
    <div class="filter-controls">
      <div class="filter-controls-title">
        過濾設定
        <button class="filter-controls-add" id="addFilter">新增過濾條件</button>
      </div>
      <div class="filter-controls-list" id="filterList"></div>
    </div>
    <script>
      const symbols = ["omu", "xro", "det", "rod", "ast", "hex"];

      const points = [1, 2, 3, 4, 5, 6];

      const directionArrays = [
        [[], [], [], [], [], []],
        [["top"], ["bottom"], ["left"], ["right"], ["bottom"], ["right"]],
        [
          ["top", "left"],
          ["top", "right"],
          ["bottom", "left"],
          ["bottom", "right"],
          ["bottom", "left"],
          ["top", "right"],
        ],
        [
          ["top", "bottom"],
          ["top", "bottom"],
          ["left", "right"],
          ["left", "right"],
          ["left", "right"],
          ["top", "bottom"],
        ],
        [
          ["top", "bottom", "right"],
          ["top", "bottom", "left"],
          ["top", "left", "right"],
          ["bottom", "left", "right"],
          ["top", "left", "right"],
          ["top", "bottom", "left"],
        ],
        [
          ["top", "bottom", "left", "right"],
          ["top", "bottom", "left", "right"],
          ["top", "bottom", "left", "right"],
          ["top", "bottom", "left", "right"],
          ["top", "bottom", "left", "right"],
          ["top", "bottom", "left", "right"],
        ],
      ];

      const attributes = ["crimson", "royalblue", "darkorange", "seagreen", "blueviolet", "sienna"];

      const piecePropsArray = symbols.flatMap((symbol) =>
        points.flatMap((point, pointIndex) =>
          directionArrays.map((directions, directionIndex) => ({
            symbol,
            point,
            serial: point + directionIndex * points.length,
            direction: directions[pointIndex],
            color:
              directionIndex % 2 === 0 ? (point % 2 === 0 ? "white" : "black") : point % 2 === 0 ? "black" : "white",
            attribute:
              attributes[(directionIndex + [1, 3, 5, 2, 4, 6][pointIndex] * attributes.length) % attributes.length],
          }))
        )
      );

      const chunkSize = Math.ceil(piecePropsArray.length / 9);

      const piecePropsArrays = [];

      for (let i = 0; i < piecePropsArray.length; i += chunkSize) {
        piecePropsArrays.push(piecePropsArray.slice(i, i + chunkSize));
      }

      const circleSvg = `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-circle-icon lucide-circle"><circle cx="12" cy="12" r="9.5"/></svg>`;

      const xSvg = `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-x-icon lucide-x"><path d="M4 4 L20 20"/><path d="M20 4 L4 20"/></svg>`;

      const triangleSvg = `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-triangle-icon lucide-triangle"><path d="M13.73 4a2 2 0 0 0-3.46 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/></svg>`;

      const squareSvg = `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-square-icon lucide-square"><rect width="18" height="18" x="3" y="3" rx="2"/></svg>`;

      const starSvg = `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-star-icon lucide-star"><path d="M11.525 2.295a.53.53 0 0 1 .95 0l2.31 4.679a2.123 2.123 0 0 0 1.595 1.16l5.166.756a.53.53 0 0 1 .294.904l-3.736 3.638a2.123 2.123 0 0 0-.611 1.878l.882 5.14a.53.53 0 0 1-.771.56l-4.618-2.428a2.122 2.122 0 0 0-1.973 0L6.396 21.01a.53.53 0 0 1-.77-.56l.881-5.139a2.122 2.122 0 0 0-.611-1.879L2.16 9.795a.53.53 0 0 1 .294-.906l5.165-.755a2.122 2.122 0 0 0 1.597-1.16z"/></svg>`;

      const hexagonSvg = `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-hexagon-icon lucide-hexagon"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg>`;

      const dice1Svg = `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-dice1-icon lucide-dice-1"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><path d="M12 12h.01"/></svg>`;

      const dice2Svg = `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-dice2-icon lucide-dice-2"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><path d="M15 9h.01"/><path d="M9 15h.01"/></svg>`;

      const dice3Svg = `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-dice3-icon lucide-dice-3"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><path d="M16 8h.01"/><path d="M12 12h.01"/><path d="M8 16h.01"/></svg>`;

      const dice4Svg = `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-dice4-icon lucide-dice-4"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><path d="M16 8h.01"/><path d="M8 8h.01"/><path d="M8 16h.01"/><path d="M16 16h.01"/></svg>`;

      const dice5Svg = `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-dice5-icon lucide-dice-5"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><path d="M16 8h.01"/><path d="M8 8h.01"/><path d="M8 16h.01"/><path d="M16 16h.01"/><path d="M12 12h.01"/></svg>`;

      const dice6Svg = `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-dice6-icon lucide-dice-6"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><path d="M16 8h.01"/><path d="M16 12h.01"/><path d="M16 16h.01"/><path d="M8 8h.01"/><path d="M8 12h.01"/><path d="M8 16h.01"/></svg>`;

      const bodyElement = document.querySelector("body");

      // 獲取縱向值
      function getVerticalType(direction) {
        const hasTop = direction.includes("top");
        const hasBottom = direction.includes("bottom");
        if (!hasTop && !hasBottom) return "無";
        if (hasTop && hasBottom) return "上下";
        if (hasTop) return "向上";
        return "向下";
      }

      // 獲取橫向值
      function getHorizontalType(direction) {
        const hasLeft = direction.includes("left");
        const hasRight = direction.includes("right");
        if (!hasLeft && !hasRight) return "無";
        if (hasLeft && hasRight) return "左右";
        if (hasLeft) return "向左";
        return "向右";
      }

      // 排序函數
      function getSortValue(piece, sortField) {
        switch (sortField) {
          case "symbol":
            return symbols.indexOf(piece.symbol);
          case "point":
            return piece.point;
          case "direction":
            const sortedDir = [...piece.direction].sort().join(",");
            return piece.direction.length * 1000 + sortedDir.localeCompare("");
          case "serial":
            return piece.serial;
          case "color":
            return piece.color === "white" ? 0 : 1;
          case "vertical":
            const verticalType = getVerticalType(piece.direction);
            const verticalOrder = ["無", "向上", "向下", "上下"];
            return verticalOrder.indexOf(verticalType);
          case "horizontal":
            const horizontalType = getHorizontalType(piece.direction);
            const horizontalOrder = ["無", "向左", "向右", "左右"];
            return horizontalOrder.indexOf(horizontalType);
          case "attribute":
            return attributes.indexOf(piece.attribute);
          default:
            return 0;
        }
      }

      function sortPieces(pieceArray, sortConfigs) {
        const filteredConfigs = sortConfigs.filter((c) => c.field);
        if (filteredConfigs.length === 0) return pieceArray;

        return [...pieceArray].sort((a, b) => {
          for (const config of filteredConfigs) {
            const aVal = getSortValue(a, config.field);
            const bVal = getSortValue(b, config.field);
            let comparison = 0;
            if (aVal < bVal) comparison = -1;
            else if (aVal > bVal) comparison = 1;

            // 如果是倒序，則反轉比較結果
            if (comparison !== 0) {
              return config.order === "desc" ? -comparison : comparison;
            }
          }
          return 0;
        });
      }

      // 創建 piece DOM 的函數
      function createPieceElement(piece) {
        const pieceWrapperElement = document.createElement("div");
        pieceWrapperElement.classList.add("piece-wrapper");
        pieceWrapperElement.classList.add("piece");

        const pieceElement = document.createElement("div");
        pieceElement.classList.add("piece");
        pieceWrapperElement.appendChild(pieceElement);

        const pieceBackfaceElement = document.createElement("div");
        pieceBackfaceElement.classList.add("piece-backface", "piece");
        pieceElement.appendChild(pieceBackfaceElement);

        const pieceBackfaceTextElement = document.createElement("div");
        pieceBackfaceTextElement.classList.add("piece-backface-text");
        pieceBackfaceTextElement.textContent = "OXDRAH";
        pieceBackfaceElement.appendChild(pieceBackfaceTextElement);

        const pieceFrontfaceElement = document.createElement("div");
        pieceFrontfaceElement.classList.add("piece-frontface", "piece");
        pieceFrontfaceElement.classList.add(`-${piece.color}`);
        pieceFrontfaceElement.classList.add(`-${piece.symbol}`);
        pieceElement.appendChild(pieceFrontfaceElement);

        piece.direction.forEach((direction) => {
          const pieceLinkElement = document.createElement("div");
          pieceLinkElement.classList.add("piece-link");
          pieceLinkElement.classList.add(`--${direction}`);
          pieceFrontfaceElement.appendChild(pieceLinkElement);
        });

        const pieceSymbolElement = document.createElement("div");
        pieceSymbolElement.classList.add("piece-symbol");

        pieceSymbolElement.innerHTML =
          piece.symbol === "omu"
            ? circleSvg
            : piece.symbol === "xro"
            ? xSvg
            : piece.symbol === "det"
            ? triangleSvg
            : piece.symbol === "rod"
            ? squareSvg
            : piece.symbol === "ast"
            ? starSvg
            : hexagonSvg;

        pieceFrontfaceElement.appendChild(pieceSymbolElement);

        const piecePointsElement = document.createElement("div");
        piecePointsElement.classList.add("piece-point");
        piecePointsElement.classList.add(`-${piece.attribute}`);
        piecePointsElement.innerHTML =
          piece.point === 6
            ? dice6Svg
            : piece.point === 5
            ? dice5Svg
            : piece.point === 4
            ? dice4Svg
            : piece.point === 3
            ? dice3Svg
            : piece.point === 2
            ? dice2Svg
            : dice1Svg;

        pieceFrontfaceElement.appendChild(piecePointsElement);

        const pieceSerialElement = document.createElement("div");
        pieceSerialElement.classList.add("piece-serial");
        pieceSerialElement.textContent = piece.serial;
        pieceFrontfaceElement.appendChild(pieceSerialElement);

        return pieceWrapperElement;
      }

      // 過濾函數
      function getDirectionType(direction) {
        const len = direction.length;
        if (len === 0) return "無向";
        if (len === 1) return "一向";
        if (len === 2) {
          const opposites = [
            ["top", "bottom"],
            ["bottom", "top"],
            ["left", "right"],
            ["right", "left"],
          ];
          const sorted = [...direction].sort();
          const isOpposite = opposites.some((opp) => sorted[0] === opp[0] && sorted[1] === opp[1]);
          return isOpposite ? "兩面" : "兩夾";
        }
        if (len === 3) return "三向";
        if (len === 4) return "四向";
        return "";
      }

      function filterPieces(pieceArray, filterConfigs) {
        if (filterConfigs.length === 0) return pieceArray;

        // 按字段和操作符分組過濾條件
        const filtersByField = {};
        filterConfigs.forEach((filter) => {
          if (!filter.field || !filter.value) return;
          if (!filtersByField[filter.field]) {
            filtersByField[filter.field] = { include: [], exclude: [] };
          }
          filtersByField[filter.field][filter.operator === "include" ? "include" : "exclude"].push(filter);
        });

        return pieceArray.filter((piece) => {
          // 不同字段組之間使用 AND 邏輯
          return Object.keys(filtersByField).every((field) => {
            const fieldFilters = filtersByField[field];

            // 獲取該字段的實際值
            let pieceValue;
            switch (field) {
              case "symbol":
                pieceValue = piece.symbol;
                break;
              case "point":
                pieceValue = piece.point.toString();
                break;
              case "direction":
                pieceValue = getDirectionType(piece.direction);
                break;
              case "vertical":
                pieceValue = getVerticalType(piece.direction);
                break;
              case "horizontal":
                pieceValue = getHorizontalType(piece.direction);
                break;
              case "serial":
                pieceValue = piece.serial.toString();
                break;
              case "color":
                pieceValue = piece.color;
                break;
              case "attribute":
                pieceValue = piece.attribute;
                break;
              default:
                return true;
            }

            // include 條件：使用 OR 邏輯（只要滿足任何一個 include 條件即可）
            const includeMatch =
              fieldFilters.include.length === 0 ||
              fieldFilters.include.some((filter) => {
                return pieceValue === filter.value || pieceValue.toString() === filter.value;
              });

            // exclude 條件：使用 AND 邏輯（必須不滿足所有 exclude 條件）
            const excludeMatch = fieldFilters.exclude.every((filter) => {
              return pieceValue !== filter.value && pieceValue.toString() !== filter.value;
            });

            // 必須同時滿足 include 和 exclude 條件
            return includeMatch && excludeMatch;
          });
        });
      }

      // 渲染 pieces 的函數
      function renderPieces(sortConfigs = [], filterConfigs = []) {
        // 刪除所有現有的 pieces
        const existingPieces = document.querySelectorAll(".pieces");
        existingPieces.forEach((el) => el.remove());

        // 過濾
        let filteredPiecePropsArray = filterPieces(piecePropsArray, filterConfigs);

        // 排序
        const sortedPiecePropsArray = sortPieces(filteredPiecePropsArray, sortConfigs);

        // 重新分組
        const chunkSize = Math.ceil(sortedPiecePropsArray.length / (sortedPiecePropsArray.length / (6 * 4)));
        const sortedPiecePropsArrays = [];
        for (let i = 0; i < sortedPiecePropsArray.length; i += chunkSize) {
          sortedPiecePropsArrays.push(sortedPiecePropsArray.slice(i, i + chunkSize));
        }

        // 重新生成 DOM
        sortedPiecePropsArrays.forEach((piecePropsArray) => {
          const piecesElement = document.createElement("div");
          piecesElement.classList.add("pieces");
          bodyElement.appendChild(piecesElement);

          piecePropsArray.forEach((piece) => {
            const pieceElement = createPieceElement(piece);
            piecesElement.appendChild(pieceElement);
          });
        });
      }

      // 過濾器管理

      function updateFilterValueOptions(valueSelect, fieldSelect) {
        const field = fieldSelect.value;
        valueSelect.innerHTML = "";

        if (!field) {
          valueSelect.disabled = true;
          return;
        }

        valueSelect.disabled = false;

        // 添加"尚未選擇"選項
        const placeholderOption = document.createElement("option");
        placeholderOption.value = "";
        placeholderOption.textContent = "尚未選擇";
        valueSelect.appendChild(placeholderOption);

        switch (field) {
          case "symbol":
            symbols.forEach((sym) => {
              const option = document.createElement("option");
              option.value = sym;
              option.textContent =
                sym === "omu"
                  ? "圈圈"
                  : sym === "xro"
                  ? "交叉"
                  : sym === "det"
                  ? "三角"
                  : sym === "rod"
                  ? "方形"
                  : sym === "ast"
                  ? "星形"
                  : "六邊";
              valueSelect.appendChild(option);
            });
            break;
          case "point":
            points.forEach((pt) => {
              const option = document.createElement("option");
              option.value = pt.toString();
              option.textContent = pt.toString();
              valueSelect.appendChild(option);
            });
            break;
          case "direction":
            ["無向", "一向", "兩夾", "兩面", "三向", "四向"].forEach((dir) => {
              const option = document.createElement("option");
              option.value = dir;
              option.textContent = dir;
              valueSelect.appendChild(option);
            });
            break;
          case "vertical":
            ["無", "向上", "向下", "上下"].forEach((ver) => {
              const option = document.createElement("option");
              option.value = ver;
              option.textContent = ver;
              valueSelect.appendChild(option);
            });
            break;
          case "horizontal":
            ["無", "對左", "對右", "左右"].forEach((hor) => {
              const option = document.createElement("option");
              option.value = hor;
              option.textContent = hor;
              valueSelect.appendChild(option);
            });
            break;
          case "serial":
            const uniqueSerials = [...new Set(piecePropsArray.map((p) => p.serial))].sort((a, b) => a - b);
            uniqueSerials.forEach((ser) => {
              const option = document.createElement("option");
              option.value = ser.toString();
              option.textContent = ser.toString();
              valueSelect.appendChild(option);
            });
            break;
          case "color":
            ["white", "black"].forEach((col) => {
              const option = document.createElement("option");
              option.value = col;
              option.textContent = col === "white" ? "白色" : "黑色";
              valueSelect.appendChild(option);
            });
            break;
          case "attribute":
            attributes.forEach((attr) => {
              const option = document.createElement("option");
              option.value = attr;
              option.textContent =
                attr === "crimson"
                  ? "紅標"
                  : attr === "royalblue"
                  ? "藍標"
                  : attr === "darkorange"
                  ? "橙標"
                  : attr === "seagreen"
                  ? "綠標"
                  : attr === "blueviolet"
                  ? "紫標"
                  : "棕標";
              valueSelect.appendChild(option);
            });
            break;
        }
      }

      function createFilterItem() {
        const item = document.createElement("div");
        item.classList.add("filter-controls-item");

        const fieldSelect = document.createElement("select");
        fieldSelect.classList.add("filter-controls-field");
        fieldSelect.innerHTML = `
          <option value="">選擇</option>
          <option value="symbol">符號</option>
          <option value="point">點數</option>
          <option value="direction">方向</option>
          <option value="vertical">縱向</option>
          <option value="horizontal">橫向</option>
          <option value="serial">序列</option>
          <option value="color">顏色</option>
          <option value="attribute">屬性</option>
        `;

        const operatorSelect = document.createElement("select");
        operatorSelect.classList.add("filter-controls-operator");
        operatorSelect.innerHTML = `
          <option value="include">包含</option>
          <option value="exclude">不含</option>
        `;

        const valueSelect = document.createElement("select");
        valueSelect.classList.add("filter-controls-value");
        valueSelect.disabled = true;

        const removeButton = document.createElement("button");
        removeButton.classList.add("filter-controls-remove");
        removeButton.textContent = "刪除";
        removeButton.addEventListener("click", () => {
          item.remove();
          // 自動應用
          applyFiltersAndSort();
        });

        fieldSelect.addEventListener("change", () => {
          updateFilterValueOptions(valueSelect, fieldSelect);
          // 自動應用（在選項更新後）
          setTimeout(applyFiltersAndSort, 0);
        });

        // 添加變化監聽
        operatorSelect.addEventListener("change", applyFiltersAndSort);
        valueSelect.addEventListener("change", applyFiltersAndSort);

        item.appendChild(fieldSelect);
        item.appendChild(operatorSelect);
        item.appendChild(valueSelect);
        item.appendChild(removeButton);

        return item;
      }

      function getFilterConfigs() {
        const items = document.querySelectorAll(".filter-controls-item");
        return Array.from(items).map((item) => {
          const fieldSelect = item.querySelector(".filter-controls-field");
          const operatorSelect = item.querySelector(".filter-controls-operator");
          const valueSelect = item.querySelector(".filter-controls-value");
          return {
            field: fieldSelect.value,
            operator: operatorSelect.value,
            value: valueSelect.value,
          };
        });
      }

      function updateSortLabels() {
        const items = document.querySelectorAll(".sort-controls-row");
        items.forEach((it, index) => {
          const lbl = it.querySelector(".sort-controls-label");
          if (lbl) {
            lbl.textContent = `${index + 1}:`;
          }
          // 更新往上按鈕狀態
          const upButton = it.querySelector(".sort-controls-up");
          if (upButton) {
            upButton.disabled = index === 0;
          }
        });
      }

      function createSortItem() {
        const item = document.createElement("div");
        item.classList.add("sort-controls-row");

        const label = document.createElement("div");
        label.classList.add("sort-controls-label");
        label.textContent = `${document.getElementById("sortList").children.length + 1}:`;

        const fieldSelect = document.createElement("select");
        fieldSelect.classList.add("sort-controls-select");
        fieldSelect.innerHTML = `
          <option value="">無</option>
          <option value="symbol">符號</option>
          <option value="point">點數</option>
          <option value="direction">方向</option>
          <option value="vertical">縱向</option>
          <option value="horizontal">橫向</option>
          <option value="serial">序列</option>
          <option value="color">顏色</option>
          <option value="attribute">屬性</option>
        `;

        const orderSelect = document.createElement("select");
        orderSelect.classList.add("sort-controls-order");
        orderSelect.innerHTML = `
          <option value="asc">正序</option>
          <option value="desc">倒序</option>
        `;

        const upButton = document.createElement("button");
        upButton.classList.add("sort-controls-up");
        upButton.textContent = "往上";
        upButton.addEventListener("click", () => {
          const sortList = document.getElementById("sortList");
          const items = Array.from(sortList.children);
          const currentIndex = items.indexOf(item);
          if (currentIndex > 0) {
            // 與前一個項目交換位置
            const prevItem = items[currentIndex - 1];
            sortList.insertBefore(item, prevItem);
            updateSortLabels();
            // 自動應用
            applyFiltersAndSort();
          }
        });

        const removeButton = document.createElement("button");
        removeButton.classList.add("sort-controls-remove");
        removeButton.textContent = "刪除";
        removeButton.addEventListener("click", () => {
          item.remove();
          updateSortLabels();
          // 自動應用
          applyFiltersAndSort();
        });

        // 添加變化監聽
        fieldSelect.addEventListener("change", applyFiltersAndSort);
        orderSelect.addEventListener("change", applyFiltersAndSort);

        item.appendChild(label);
        item.appendChild(fieldSelect);
        item.appendChild(orderSelect);
        item.appendChild(upButton);
        item.appendChild(removeButton);

        return item;
      }

      function getSortConfigs() {
        const items = document.querySelectorAll(".sort-controls-row");
        return Array.from(items).map((item) => {
          const fieldSelect = item.querySelector(".sort-controls-select");
          const orderSelect = item.querySelector(".sort-controls-order");
          return {
            field: fieldSelect.value,
            order: orderSelect.value,
          };
        });
      }

      function applyFiltersAndSort() {
        const sortConfigs = getSortConfigs();
        const filterConfigs = getFilterConfigs();
        renderPieces(sortConfigs, filterConfigs);
      }

      // 初始渲染
      renderPieces();

      // 排序控制
      const sortList = document.getElementById("sortList");
      const addSortButton = document.getElementById("addSort");

      addSortButton.addEventListener("click", () => {
        const item = createSortItem();
        sortList.appendChild(item);
        updateSortLabels();
        // 不需要自動應用，因為新項目的選擇器都是默認值，等待用戶選擇後再應用
      });

      // 過濾控制
      const filterList = document.getElementById("filterList");
      const addFilterButton = document.getElementById("addFilter");

      addFilterButton.addEventListener("click", () => {
        const item = createFilterItem();
        filterList.appendChild(item);
        // 不需要自動應用，因為新項目的選擇器都是默認值，等待用戶選擇後再應用
      });
    </script>
  </body>
</html>
