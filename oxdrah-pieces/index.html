<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OXDRAH PIECES</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Sono:wght@200..800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles/base.css" />
    <link rel="stylesheet" href="./styles/layout.css" />
    <link rel="stylesheet" href="./styles/piece.css" />
    <link rel="stylesheet" href="./styles/pieces.css" />
  </head>
  <body>
    <div class="pieces-header">OXDRAH PIECES</div>
    <div class="appearance-controls">
      <label class="appearance-controls-title" for="versionSelect">外觀選擇</label>
      <div class="appearance-controls-group">
        <label class="appearance-controls-checkbox-label">
          <input type="checkbox" id="stripedCutCheckbox" class="appearance-controls-checkbox" checked />
          <span>刻痕</span>
        </label>
        <select id="versionSelect" class="appearance-controls-select">
          <option value="v1">版本 1</option>
          <option value="v2" selected>版本 2</option>
        </select>
      </div>
    </div>
    <div class="sort-controls">
      <div class="sort-controls-title">
        排序設定
        <button class="sort-controls-add" id="addSort">新增排序條件</button>
      </div>
      <div class="sort-controls-list" id="sortList"></div>
    </div>
    <div class="filter-controls">
      <div class="filter-controls-title">
        過濾設定
        <button class="filter-controls-add" id="addFilter">新增過濾條件</button>
      </div>
      <div class="filter-controls-list" id="filterList"></div>
    </div>
    <div class="print-controls">
      <div class="print-controls-header">
        <div class="print-controls-title">列印設定</div>
        <label class="print-controls-checkbox-label">
          <input type="checkbox" id="printControlsCheckbox" class="print-controls-checkbox" />
          <span>啟用</span>
        </label>
      </div>
      <div class="print-controls-group">
        <label class="print-controls-input">
          <span>列印垂直間距(mm)</span>
          <input type="number" id="printVerticalGap" value="1" />
        </label>
        <label class="print-controls-input">
          <span>列印水平間距(mm)</span>
          <input type="number" id="printHorizontalGap" value="1" />
        </label>
        <label class="print-controls-input">
          <span>列印垂直內距(mm)</span>
          <input type="number" id="printVerticalPadding" value="7.5" />
        </label>
        <label class="print-controls-input">
          <span>列印水平內距(mm)</span>
          <input type="number" id="printHorizontalPadding" value="7.5" />
        </label>
        <label class="print-controls-input">
          <span>每頁列印寬度(mm)</span>
          <input type="number" id="printPageWidth" value="297" />
        </label>
        <label class="print-controls-input">
          <span>每頁列印高度(mm)</span>
          <input type="number" id="printPageHeight" value="210" />
        </label>
        <label class="print-controls-input">
          <span>每頁列印行數</span>
          <input type="number" id="printRowCount" value="5" />
        </label>
        <label class="print-controls-input">
          <span>每頁列印列數</span>
          <input type="number" id="printColumnCount" value="4" />
        </label>
      </div>
    </div>
    <script src="./scripts/piece.js"></script>
    <script src="./scripts/main.js"></script>
  </body>
</html>
