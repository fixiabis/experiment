<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>影片播放器</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      display: flex;
      height: 100vh;
      background: #1a1a1a;
      color: #e0e0e0;
      font-family: system-ui, -apple-system, sans-serif;
      overflow: hidden;
    }

    /* ── 播放器區域 ── */
    .player-section {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      min-width: 0;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .player-placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      color: #555;
      user-select: none;
    }

    .player-placeholder svg {
      width: 72px;
      height: 72px;
      opacity: 0.4;
    }

    .player-placeholder p {
      font-size: 14px;
    }

    /* ── 播放清單側欄 ── */
    .playlist-section {
      width: 280px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      background: #242424;
      border-left: 1px solid #333;
    }

    .playlist-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      border-bottom: 1px solid #333;
      flex-shrink: 0;
    }

    .playlist-header h2 {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: #ccc;
    }

    .add-btn {
      width: 28px;
      height: 28px;
      border: none;
      border-radius: 6px;
      background: #3a3a3a;
      color: #aaa;
      font-size: 20px;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, color 0.15s;
    }

    .add-btn:hover {
      background: #4a4a4a;
      color: #fff;
    }

    /* ── 清單條目 ── */
    .playlist-items {
      flex: 1;
      overflow-y: auto;
      padding: 8px 0;
    }

    .playlist-items::-webkit-scrollbar {
      width: 5px;
    }

    .playlist-items::-webkit-scrollbar-track {
      background: transparent;
    }

    .playlist-items::-webkit-scrollbar-thumb {
      background: #444;
      border-radius: 3px;
    }

    .playlist-empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding: 40px 16px;
      color: #555;
      font-size: 13px;
      text-align: center;
    }

    .playlist-item {
      position: relative;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 16px;
      cursor: pointer;
      border-radius: 6px;
      margin: 0 8px;
      transition: background 0.12s;
      min-width: 0;
    }

    .playlist-item:hover {
      background: #2e2e2e;
    }

    .playlist-item.active {
      background: #2a3a52;
    }

    .playlist-item.active .item-name {
      color: #6aadff;
    }

    .item-icon {
      flex-shrink: 0;
      color: #666;
    }

    .playlist-item.active .item-icon {
      color: #6aadff;
    }

    .item-info {
      min-width: 0;
      flex: 1;
    }

    .remove-btn {
      flex-shrink: 0;
      width: 22px;
      height: 22px;
      border: none;
      border-radius: 4px;
      background: transparent;
      color: #555;
      font-size: 16px;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: background 0.12s, color 0.12s, opacity 0.12s;
    }

    .playlist-item:hover .remove-btn {
      opacity: 1;
    }

    .remove-btn:hover {
      background: #5a2a2a;
      color: #ff6b6b;
    }

    .item-name {
      font-size: 13px;
      color: #ccc;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .item-meta {
      font-size: 11px;
      color: #666;
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .drag-handle {
      position: absolute;
      left: 1px;
      top: 50%;
      transform: translateY(-50%);
      color: #555;
      cursor: grab;
      opacity: 0;
      transition: opacity 0.12s;
      display: flex;
      align-items: center;
    }

    .playlist-item:hover .drag-handle {
      opacity: 1;
    }

    .playlist-item.dragging {
      opacity: 0.35;
    }

    .drop-indicator {
      height: 2px;
      background: #6aadff;
      border-radius: 1px;
      margin: 0 8px;
      display: none;
    }

    .drop-indicator.visible {
      display: block;
    }

    .autoplay-btn {
      height: 28px;
      padding: 0 8px;
      border: none;
      border-radius: 6px;
      background: #3a3a3a;
      color: #888;
      font-size: 11px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: background 0.15s, color 0.15s;
      white-space: nowrap;
    }

    .autoplay-btn:hover {
      background: #4a4a4a;
      color: #ccc;
    }

    .autoplay-btn.active {
      background: #1a4a2e;
      color: #4caf7a;
    }

    /* 隱藏的 file input */
    #file-input {
      display: none;
    }
  </style>
</head>
<body>

  <!-- 影片播放器 -->
  <section class="player-section" id="player-section">
    <div class="player-placeholder" id="placeholder">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2">
        <rect x="2" y="4" width="20" height="16" rx="2"/>
        <polygon points="10,8 16,12 10,16" fill="currentColor" stroke="none"/>
      </svg>
      <p>從播放清單選取影片</p>
    </div>
    <video id="video" style="display:none" controls></video>
  </section>

  <!-- 播放清單 -->
  <aside class="playlist-section">
    <header class="playlist-header">
      <h2>播放清單</h2>
      <div style="display:flex;gap:6px;align-items:center">
        <button class="autoplay-btn" id="autoplay-btn" title="自動播放下一部">自動播放</button>
        <button class="add-btn" id="add-btn" title="新增影片">+</button>
      </div>
    </header>
    <div class="playlist-items" id="playlist-items">
      <div class="playlist-empty" id="playlist-empty">
        點擊 + 新增本機影片
      </div>
    </div>
  </aside>

  <input type="file" id="file-input" multiple>

  <script>
    const video = document.getElementById('video');
    const placeholder = document.getElementById('placeholder');
    const playlistItems = document.getElementById('playlist-items');
    const playlistEmpty = document.getElementById('playlist-empty');
    const addBtn = document.getElementById('add-btn');
    const fileInput = document.getElementById('file-input');
    const autoplayBtn = document.getElementById('autoplay-btn');

    // 目前播放清單：[{ name, size, url }]
    let items = [];
    let activeIndex = -1;
    let dragIndex = -1;

    autoplayBtn.addEventListener('click', () => {
      autoplayBtn.classList.toggle('active');
    });

    // play/pause 連按計數：1下=正常、2下=+10秒、3下=+30秒
    let pressCount = 0;
    let pressTimer = null;
    let ignorePressEvent = false;

    function seek(seconds) {
      video.currentTime = Math.max(0, video.currentTime + seconds);
      ignorePressEvent = true;
      video.play().finally(() => { ignorePressEvent = false; });
    }

    function onPlayPausePress() {
      if (ignorePressEvent) return;
      pressCount++;
      clearTimeout(pressTimer);
      pressTimer = setTimeout(() => {
        if (pressCount === 2) seek(10);
        else if (pressCount >= 3) seek(30);
        pressCount = 0;
      }, 300);
    }

    video.addEventListener('play', onPlayPausePress);
    video.addEventListener('pause', onPlayPausePress);

    video.addEventListener('ended', () => {
      if (!autoplayBtn.classList.contains('active')) return;
      const next = (activeIndex + 1) % items.length;
      playItem(next);
    });

    addBtn.addEventListener('click', () => fileInput.click());

    fileInput.addEventListener('change', (e) => {
      const files = Array.from(e.target.files);
      files.forEach(file => {
        const url = URL.createObjectURL(file);
        items.push({ name: file.name, size: file.size, url });
      });
      fileInput.value = '';
      renderPlaylist();
    });

    function formatSize(bytes) {
      if (bytes >= 1024 ** 3) return (bytes / 1024 ** 3).toFixed(1) + ' GB';
      if (bytes >= 1024 ** 2) return (bytes / 1024 ** 2).toFixed(1) + ' MB';
      return (bytes / 1024).toFixed(0) + ' KB';
    }

    function playItem(index) {
      if (index === activeIndex) return;
      activeIndex = index;
      const item = items[index];

      video.src = item.url;
      video.style.display = 'block';
      placeholder.style.display = 'none';
      ignorePressEvent = true;
      video.play().finally(() => { ignorePressEvent = false; });

      renderPlaylist();
    }

    function removeItem(index) {
      URL.revokeObjectURL(items[index].url);
      items.splice(index, 1);
      if (activeIndex === index) {
        activeIndex = -1;
        video.pause();
        video.src = '';
        video.style.display = 'none';
        placeholder.style.display = 'flex';
      } else if (activeIndex > index) {
        activeIndex--;
      }
      renderPlaylist();
    }

    function renderPlaylist() {
      playlistEmpty.style.display = items.length ? 'none' : 'flex';

      // 移除舊條目與指示線（保留 empty hint）
      Array.from(playlistItems.querySelectorAll('.playlist-item, .drop-indicator')).forEach(el => el.remove());

      items.forEach((item, i) => {
        // 插入條目前的 drop indicator
        const indicator = document.createElement('div');
        indicator.className = 'drop-indicator';
        indicator.dataset.pos = i;
        playlistItems.appendChild(indicator);

        const el = document.createElement('div');
        el.className = 'playlist-item' + (i === activeIndex ? ' active' : '');
        el.draggable = true;
        el.dataset.index = i;
        el.innerHTML = `
          <span class="drag-handle">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="currentColor">
              <circle cx="4" cy="3" r="1.2"/><circle cx="10" cy="3" r="1.2"/>
              <circle cx="4" cy="7" r="1.2"/><circle cx="10" cy="7" r="1.2"/>
              <circle cx="4" cy="11" r="1.2"/><circle cx="10" cy="11" r="1.2"/>
            </svg>
          </span>
          <span class="item-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <rect x="2" y="4" width="20" height="16" rx="2"/>
              <polygon points="10,8 16,12 10,16" fill="currentColor" stroke="none"/>
            </svg>
          </span>
          <div class="item-info">
            <div class="item-name" title="${escapeHtml(item.name)}">${escapeHtml(item.name)}</div>
            <div class="item-meta">${formatSize(item.size)}</div>
          </div>
          <button class="remove-btn" title="移除">−</button>
        `;

        el.querySelector('.remove-btn').addEventListener('click', (e) => {
          e.stopPropagation();
          removeItem(i);
        });
        el.addEventListener('click', () => playItem(i));

        // ── 拖曳事件 ──
        el.addEventListener('dragstart', (e) => {
          dragIndex = i;
          e.dataTransfer.effectAllowed = 'move';
          setTimeout(() => el.classList.add('dragging'), 0);
        });

        el.addEventListener('dragend', () => {
          dragIndex = -1;
          el.classList.remove('dragging');
          playlistItems.querySelectorAll('.drop-indicator').forEach(d => d.classList.remove('visible'));
        });

        el.addEventListener('dragover', (e) => {
          e.preventDefault();
          e.dataTransfer.dropEffect = 'move';
          const mid = el.getBoundingClientRect().top + el.offsetHeight / 2;
          const insertPos = e.clientY < mid ? i : i + 1;
          showIndicator(insertPos);
        });

        el.addEventListener('drop', (e) => {
          e.preventDefault();
          const mid = el.getBoundingClientRect().top + el.offsetHeight / 2;
          const insertPos = e.clientY < mid ? i : i + 1;
          moveItem(dragIndex, insertPos);
        });

        playlistItems.appendChild(el);
      });

      // 最末尾的 indicator（放在最後一個條目之後）
      const lastIndicator = document.createElement('div');
      lastIndicator.className = 'drop-indicator';
      lastIndicator.dataset.pos = items.length;
      lastIndicator.addEventListener('dragover', (e) => {
        e.preventDefault();
        showIndicator(items.length);
      });
      lastIndicator.addEventListener('drop', (e) => {
        e.preventDefault();
        moveItem(dragIndex, items.length);
      });
      playlistItems.appendChild(lastIndicator);
    }

    function showIndicator(pos) {
      playlistItems.querySelectorAll('.drop-indicator').forEach(d => {
        d.classList.toggle('visible', Number(d.dataset.pos) === pos);
      });
    }

    function moveItem(from, to) {
      if (from === -1 || from === to || from + 1 === to) return;
      const moved = items.splice(from, 1)[0];
      const insertAt = to > from ? to - 1 : to;
      items.splice(insertAt, 0, moved);
      if (activeIndex === from) {
        activeIndex = insertAt;
      } else if (from < activeIndex && insertAt >= activeIndex) {
        activeIndex--;
      } else if (from > activeIndex && insertAt <= activeIndex) {
        activeIndex++;
      }
      renderPlaylist();
    }

    function escapeHtml(str) {
      return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }
  </script>
</body>
</html>
